name: Build Standalone Desktop Apps

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    name: Build for ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        include:
          - os: ubuntu-latest
            artifact_name: StudyFlowEduAI-Linux
            executable_path: dist/StudyFlowEduAI
          - os: macos-latest
            artifact_name: StudyFlowEduAI-macOS
            executable_path: dist/StudyFlowEduAI
          - os: windows-latest
            artifact_name: StudyFlowEduAI-Windows
            executable_path: dist/StudyFlowEduAI.exe

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
        cache: 'pip'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pyinstaller

    - name: Build Standalone Executable with PyInstaller
      run: |
        pyinstaller --onefile --windowed --name "StudyFlowEduAI" main.py

    - name: Upload Executable Artifact
      uses: actions/upload-artifact@v4
      with:
        name: ${{ matrix.artifact_name }}
        path: ${{ matrix.executable_path }}
