<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StudyFlow — Sign In</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        brand: {
                            50: '#f5f3ff',
                            100: '#ede9fe',
                            500: '#6366f1',
                            600: '#4f46e5',
                            700: '#4338ca',
                        }
                    }
                }
            }
        }
    </script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex items-center justify-center p-4">

    <div class="w-full max-w-md bg-slate-900 border border-slate-800 rounded-2xl p-6 shadow-xl space-y-6">
        
        <!-- Logo & Header -->
        <div class="text-center space-y-2">
            <div class="inline-flex items-center justify-center w-12 h-12 bg-brand-600/20 text-brand-500 rounded-2xl border border-brand-500/30 mb-2">
                <i class="fa-solid fa-graduation-cap text-2xl"></i>
            </div>
            <h1 class="text-2xl font-bold tracking-tight text-white">StudyFlow EduAI</h1>
            <p class="text-sm text-slate-400">Next-Gen Intelligent Learning Suite</p>
        </div>

        {% if error %}
        <div class="bg-rose-500/10 text-rose-400 border border-rose-500/25 px-4 py-2.5 rounded-lg text-sm flex items-start space-x-2">
            <i class="fa-solid fa-circle-exclamation mt-0.5"></i>
            <span>{{ error }}</span>
        </div>
        {% endif %}

        {% if success %}
        <div class="bg-emerald-500/10 text-emerald-400 border border-emerald-500/25 px-4 py-2.5 rounded-lg text-sm flex items-start space-x-2">
            <i class="fa-solid fa-circle-check mt-0.5"></i>
            <span>{{ success }}</span>
        </div>
        {% endif %}

        <!-- Tab Controllers -->
        <div class="grid grid-cols-3 bg-slate-800 p-1 rounded-lg text-sm font-semibold border border-slate-700">
            <button onclick="switchTab('login-form')" id="login-tab-btn" class="py-1.5 rounded-md text-white bg-slate-700">Login</button>
            <button onclick="switchTab('register-form')" id="register-tab-btn" class="py-1.5 rounded-md text-slate-400 hover:text-white">Sign Up</button>
            <button onclick="switchTab('reset-form')" id="reset-tab-btn" class="py-1.5 rounded-md text-slate-400 hover:text-white">Reset</button>
        </div>

        <!-- 1. LOGIN FORM -->
        <form id="login-form" action="/login" method="POST" class="space-y-4">
            <div class="space-y-1">
                <label class="text-xs text-slate-400 font-medium">Username</label>
                <input type="text" name="username" required class="w-full bg-slate-950 border border-slate-800 rounded-lg px-3.5 py-2 text-sm text-slate-100 focus:outline-none focus:border-brand-500 transition">
            </div>
            <div class="space-y-1">
                <label class="text-xs text-slate-400 font-medium">Password</label>
                <input type="password" name="password" required class="w-full bg-slate-950 border border-slate-800 rounded-lg px-3.5 py-2 text-sm text-slate-100 focus:outline-none focus:border-brand-500 transition">
            </div>
            <div class="flex items-center">
                <input type="checkbox" name="remember_me" id="remember" class="w-4 h-4 rounded text-brand-600 bg-slate-950 border-slate-800 focus:ring-brand-500 focus:ring-2 focus:ring-offset-slate-900">
                <label for="remember" class="ml-2 text-xs text-slate-400">Remember me on this device</label>
            </div>
            <button type="submit" class="w-full py-2.5 bg-brand-600 hover:bg-brand-700 rounded-lg text-sm font-bold text-white transition">Sign In</button>
        </form>

        <!-- 2. REGISTER FORM -->
        <form id="register-form" action="/register" method="POST" class="space-y-4 hidden">
            <div class="space-y-1">
                <label class="text-xs text-slate-400 font-medium">Choose Username</label>
                <input type="text" name="username" required class="w-full bg-slate-950 border border-slate-800 rounded-lg px-3.5 py-2 text-sm text-slate-100 focus:outline-none focus:border-brand-500 transition">
            </div>
            <div class="space-y-1">
                <label class="text-xs text-slate-400 font-medium">Email Address</label>
                <input type="email" name="email" required class="w-full bg-slate-950 border border-slate-800 rounded-lg px-3.5 py-2 text-sm text-slate-100 focus:outline-none focus:border-brand-500 transition">
            </div>
            <div class="space-y-1">
                <label class="text-xs text-slate-400 font-medium">Create Password</label>
                <input type="password" name="password" required class="w-full bg-slate-950 border border-slate-800 rounded-lg px-3.5 py-2 text-sm text-slate-100 focus:outline-none focus:border-brand-500 transition">
            </div>
            <div class="space-y-1">
                <label class="text-xs text-slate-400 font-medium">Account Role</label>
                <select name="role" class="w-full bg-slate-950 border border-slate-800 rounded-lg px-3.5 py-2 text-sm text-slate-100 focus:outline-none focus:border-brand-500 transition">
                    <option value="student">Student</option>
                    <option value="educator">Educator</option>
                </select>
            </div>
            <button type="submit" class="w-full py-2.5 bg-brand-600 hover:bg-brand-700 rounded-lg text-sm font-bold text-white transition">Sign Up</button>
        </form>

        <!-- 3. RESET FORM -->
        <form id="reset-form" action="/reset" method="POST" class="space-y-4 hidden">
            <div class="space-y-1">
                <label class="text-xs text-slate-400 font-medium">Username</label>
                <input type="text" name="username" required class="w-full bg-slate-950 border border-slate-800 rounded-lg px-3.5 py-2 text-sm text-slate-100 focus:outline-none focus:border-brand-500 transition">
            </div>
            <div class="space-y-1">
                <label class="text-xs text-slate-400 font-medium">Registered Email Address</label>
                <input type="email" name="email" required class="w-full bg-slate-950 border border-slate-800 rounded-lg px-3.5 py-2 text-sm text-slate-100 focus:outline-none focus:border-brand-500 transition">
            </div>
            <div class="space-y-1">
                <label class="text-xs text-slate-400 font-medium">New Password</label>
                <input type="password" name="new_password" required class="w-full bg-slate-950 border border-slate-800 rounded-lg px-3.5 py-2 text-sm text-slate-100 focus:outline-none focus:border-brand-500 transition">
            </div>
            <button type="submit" class="w-full py-2.5 bg-brand-600 hover:bg-brand-700 rounded-lg text-sm font-bold text-white transition">Reset Password</button>
        </form>

    </div>

    <script>
        function switchTab(tabId) {
            const forms = ['login-form', 'register-form', 'reset-form'];
            forms.forEach(f => {
                const element = document.getElementById(f);
                if (f === tabId) {
                    element.classList.remove('hidden');
                } else {
                    element.classList.add('hidden');
                }
            });

            // Adjust Tab Header Styling
            const tabs = ['login-tab-btn', 'register-tab-btn', 'reset-tab-btn'];
            const activeTabBtn = tabId.split('-')[0] + '-tab-btn';
            tabs.forEach(t => {
                const btn = document.getElementById(t);
                if (t === activeTabBtn) {
                    btn.classList.add('bg-slate-700', 'text-white');
                    btn.classList.remove('text-slate-400');
                } else {
                    btn.classList.remove('bg-slate-700', 'text-white');
                    btn.classList.add('text-slate-400');
                }
            });
        }
    </script>
</body>
</html>
